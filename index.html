<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon"       href="src/img/ico.ico" type="image/x-icon">
    <link rel="stylesheet" href="src/css/hermanos.css">
    <link rel="stylesheet" href="src/css/login.css">
    <link rel="stylesheet" href="src/css/app.css">
    <title>Sorteo de Grupos — Comunidad</title>
</head>
<body>

<!-- ══ LOGIN OVERLAY ══════════════════════════════════════════════ -->
<div id="login-overlay" class="login-overlay">
    <div class="login-card">
        <div class="login-logo">⛪</div>
        <h2>Comunidad 4</h2>
        <p class="subtitle">Inicia sesión para continuar</p>
        <button id="btn-google" class="btn-google">
            <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                <path fill="none" d="M0 0h48v48H0z"/>
            </svg>
            <span id="google-btn-text">Continuar con Google</span>
        </button>
        <div id="login-error" class="login-error"></div>
    </div>
</div>

<!-- ══ APP CONTENT ════════════════════════════════════════════════ -->
<div id="app-content" style="display:none;">

    <!-- Nav -->
    <nav class="nav-bar">
        <span class="nav-logo">⛪ Comunidad</span>
        <a href="index.html"     class="nav-link"><span class="nav-icon">🎲</span> Sorteo</a>
        <a href="hermanos.html"  class="nav-link"><span class="nav-icon">👥</span> Hermanos</a>
        <a href="comunidad.html" class="nav-link"><span class="nav-icon">🏠</span> Comunidad</a>
        <a href="parroquia.html" class="nav-link"><span class="nav-icon">⛪</span> Parroquia</a>
        <a href="realidad.html"  class="nav-link"><span class="nav-icon">📚</span> Realidad</a>
        <a href="modulos.html"   class="nav-link"><span class="nav-icon">🧩</span> Módulos</a>
    </nav>

    <!-- Top bar -->
    <div id="top-bar" class="top-bar" style="display:none;">
        <img id="user-photo" class="user-photo" src="" alt="" style="display:none;">
        <span class="user-info" id="user-info"></span>
        <button id="btn-ajustes" class="btn-outline" style="margin-right:8px; padding:6px 12px; font-size:0.85rem; border-radius:5px; cursor:pointer; background:white; color:var(--text); border:1px solid #ccc; font-family:sans-serif;">⚙️ Ajustes</button><button id="btn-logout" class="btn-logout">Cerrar sesión</button>
    </div>

    <!-- Sorteo original -->
    <div class="container">
        <h1>Comunidad 4</h1>
        <div class="selector-section">
            <h3>1. Seleccione de 2 a 10 Encargados</h3>
            <p id="contador">Seleccionados: 0</p>
            <div id="lista-check" class="grid-personas">Cargando nombres...</div>
        </div>
        <button id="btnSortear" class="btn-sortear" disabled>Sortear</button>
        <div id="resultados"></div>
    </div>

</div>

<script type="module" src="src/js/auth.js"></script>
<script src="src/js/hermanos.js"></script>
</body>
</html>
